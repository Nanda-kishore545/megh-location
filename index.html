<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Megh AI - Location Sharing</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: #1e293b;
            border-radius: 20px;
            padding: 30px 22px;
            text-align: center;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
        }

        .logo {
            font-size: 45px;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
            line-height: 1.5;
        }

        .status-box {
            padding: 18px;
            border-radius: 15px;
            background: #334155;
            margin-bottom: 20px;
        }

        .status {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .details {
            color: #cbd5e1;
            font-size: 14px;
            line-height: 1.7;
        }

        button {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        #startButton {
            background: #22c55e;
            color: white;
        }

        #startButton:hover {
            background: #16a34a;
        }

        #stopButton {
            background: #ef4444;
            color: white;
            display: none;
        }

        #stopButton:hover {
            background: #dc2626;
        }

        .warning {
            color: #fbbf24;
            font-size: 13px;
            margin-top: 20px;
            line-height: 1.5;
        }

        .error {
            color: #f87171;
            margin-top: 15px;
            font-size: 14px;
            line-height: 1.5;
        }

        .success {
            color: #4ade80;
            margin-top: 15px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="logo">📍</div>

    <h1>Megh AI</h1>

    <p class="subtitle">
        Location Sharing
    </p>

    <div class="status-box">

        <div class="status" id="status">
            Location sharing is OFF
        </div>

        <div class="details" id="details">
            Your location is not currently being shared.
        </div>

    </div>

    <button id="startButton">
        📍 Start Sharing Location
    </button>

    <button id="stopButton">
        🛑 Stop Sharing
    </button>

    <div id="message"></div>

    <p class="warning">
        Your browser will ask for permission before sharing your location.
        You can stop sharing at any time.
    </p>

</div>


<script>

    /*
        IMPORTANT

        Replace this with your deployed
        Supabase Edge Function URL.

        Example:

        https://YOUR-PROJECT.supabase.co/functions/v1/location-update
    */

    const LOCATION_UPDATE_URL =
        "https://ukywxlvvszgkgcrpxszs.supabase.co/functions/v1/location-update";

    const WRITE_CODE =
        window.location.hash.substring(1);


    /*
        The sharing code.

        For the first test, replace this with
        the share_code you created in Supabase.

        Example:

        MEGH-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
    */




    let watchId = null;


    const statusElement =
        document.getElementById("status");

    const detailsElement =
        document.getElementById("details");

    const messageElement =
        document.getElementById("message");

    const startButton =
        document.getElementById("startButton");

    const stopButton =
        document.getElementById("stopButton");


    /*
        Show messages
    */

    function showMessage(text, type) {

        messageElement.textContent = text;

        messageElement.className = type;

    }


    /*
        Send location to Supabase
    */

    async function sendLocation(position) {

        const latitude =
            position.coords.latitude;

        const longitude =
            position.coords.longitude;

        const accuracy =
            position.coords.accuracy;


        console.log(
            "Latitude:",
            latitude
        );

        console.log(
            "Longitude:",
            longitude
        );

        console.log(
            "Accuracy:",
            accuracy
        );


        try {

            const response = await fetch(
                LOCATION_UPDATE_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        write_code:
                            WRITE_CODE,
                            

                        latitude:
                            latitude,

                        longitude:
                            longitude,

                        accuracy:
                            accuracy

                    })

                }
            );


            const result =
                await response.json();


            if (!response.ok) {

                console.error(result);

                showMessage(
                    result.error ||
                    "Unable to update location.",
                    "error"
                );

                return;

            }


            const time =
                new Date()
                    .toLocaleTimeString();


            statusElement.textContent =
                "🟢 Location sharing is ON";


            detailsElement.innerHTML =
                "Location updated successfully.<br>" +
                "Last update: " + time +
                "<br>" +
                "Accuracy: ±" +
                Math.round(accuracy) +
                " meters";


            showMessage(
                "Your location is being shared.",
                "success"
            );

        }

        catch (error) {

            console.error(error);

            showMessage(
                "Could not connect to the location server.",
                "error"
            );

        }

    }


    /*
        GPS error
    */

    function locationError(error) {

        console.error(error);


        if (error.code === 1) {

            showMessage(
                "Location permission was denied.",
                "error"
            );

        }

        else if (error.code === 2) {

            showMessage(
                "Your location could not be determined.",
                "error"
            );

        }

        else if (error.code === 3) {

            showMessage(
                "Location request timed out.",
                "error"
            );

        }

        else {

            showMessage(
                "Unable to get your location.",
                "error"
            );

        }

    }


    /*
        Start location sharing
    */

    function startSharing() {

        if (!navigator.geolocation) {

            showMessage(
                "Your browser does not support location services.",
                "error"
            );

            return;

        }


        if (
            LOCATION_UPDATE_URL.includes(
                "YOUR_LOCATION"
            )
        ) {

            showMessage(
                "Location server URL has not been configured yet.",
                "error"
            );

            return;

        }


if (!WRITE_CODE) {
    showMessage(
        "Invalid location sharing link.",
        "error"
    );
    return;
}


        statusElement.textContent =
            "🟡 Requesting location...";


        detailsElement.textContent =
            "Please allow location access in your browser.";


        startButton.style.display =
            "none";

        stopButton.style.display =
            "block";


        /*
            watchPosition continuously monitors
            location changes.
        */

        watchId =
            navigator.geolocation.watchPosition(

                sendLocation,

                locationError,

                {
                    enableHighAccuracy: true,

                    maximumAge: 10000,

                    timeout: 20000
                }

            );

    }


    /*
        Stop location sharing
    */


async function stopSharing() {
    if (watchId !== null) {
        navigator.geolocation.clearWatch(watchId);
        watchId = null;
    }

    statusElement.textContent = "🔴 Location sharing is OFF";
    detailsElement.textContent =
        "Your location is no longer being shared.";

    startButton.style.display = "block";
    stopButton.style.display = "none";

    try {
        const response = await fetch(
            "YOUR_SUPABASE_PROJECT_URL/functions/v1/location-stop",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    write_code: WRITE_CODE
                })
            }
        );

        if (!response.ok) {
            throw new Error("Could not update sharing status.");
        }

        showMessage("Location sharing stopped.", "success");
    } catch (error) {
        showMessage(
            "GPS stopped, but the server may still show sharing as active. Please try again.",
            "error"
        );
        console.error(error);
    }
}

</script>

</body>
</html>
